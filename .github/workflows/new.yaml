name: Deploy Python App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/NEtpython
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            pm2 delete pytes || true
            pm2 start "venv/bin/python app.py" --name pytes
            pm2 save
